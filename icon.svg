<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f0f11"/>

  <!-- Gold ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#c9a84c" stroke-width="16"/>

  <!-- Face -->
  <circle cx="230" cy="260" r="120" fill="#c4956a"/>

  <!-- Hat -->
  <ellipse cx="230" cy="185" rx="120" ry="60" fill="#2c5071"/>
  <rect x="110" y="180" width="240" height="12" rx="6" fill="#233f57"/>

  <!-- Anchor symbol on hat -->
  <circle cx="230" cy="160" r="8" fill="none" stroke="#c9a84c" stroke-width="3"/>
  <line x1="230" y1="168" x2="230" y2="185" stroke="#c9a84c" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 180 C220 185 230 188 230 188 C230 188 240 185 240 180" fill="none" stroke="#c9a84c" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="205" cy="245" r="10" fill="#2c5071"/>
  <circle cx="255" cy="245" r="10" fill="#2c5071"/>

  <!-- Small smile -->
  <path d="M215 275 Q230 290 245 275" fill="none" stroke="#2c5071" stroke-width="4" stroke-linecap="round"/>

  <!-- Clipboard body (held to the right side) -->
  <rect x="320" y="200" width="80" height="110" rx="8" fill="#e8d5a3" stroke="#c9a84c" stroke-width="3"/>

  <!-- Clipboard clip -->
  <rect x="340" y="192" width="40" height="18" rx="4" fill="#c9a84c"/>

  <!-- Checklist lines on clipboard -->
  <!-- Check 1 - completed -->
  <polyline points="332,228 338,234 348,222" fill="none" stroke="#2c8c5a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="356" y1="228" x2="388" y2="228" stroke="#8b7748" stroke-width="3" stroke-linecap="round"/>

  <!-- Check 2 - completed -->
  <polyline points="332,252 338,258 348,246" fill="none" stroke="#2c8c5a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="356" y1="252" x2="388" y2="252" stroke="#8b7748" stroke-width="3" stroke-linecap="round"/>

  <!-- Check 3 - empty box (pending) -->
  <rect x="330" y="268" width="16" height="16" rx="2" fill="none" stroke="#8b7748" stroke-width="2.5"/>
  <line x1="356" y1="276" x2="388" y2="276" stroke="#8b7748" stroke-width="3" stroke-linecap="round"/>

  <!-- Check 4 - empty box (pending) -->
  <rect x="330" y="292" width="16" height="16" rx="2" fill="none" stroke="#8b7748" stroke-width="2.5"/>
  <line x1="356" y1="300" x2="388" y2="300" stroke="#8b7748" stroke-width="3" stroke-linecap="round"/>

  <!-- Dan's hand/arm holding clipboard -->
  <path d="M310 310 Q300 290 310 260 Q315 240 320 230" fill="none" stroke="#c4956a" stroke-width="18" stroke-linecap="round"/>
</svg>
