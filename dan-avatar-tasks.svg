<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0f0f11"/>

  <!-- Neck -->
  <rect x="75" y="148" width="50" height="22" rx="4" fill="#c4956a"/>

  <!-- Collar / Shirt -->
  <path d="M60 165 Q60 190 100 195 Q140 190 140 165 L135 155 Q100 170 65 155 Z" fill="#1e3a5f"/>

  <!-- Face - tilted slightly down (looking at clipboard) -->
  <ellipse cx="100" cy="118" rx="42" ry="46" fill="#d4a574"/>
  <ellipse cx="100" cy="138" rx="35" ry="18" fill="#c4956a"/>

  <!-- Beard -->
  <path d="M68 123 Q68 155 100 160 Q132 155 132 123" fill="#8b7b6b" opacity="0.7"/>
  <path d="M72 128 Q72 150 100 155 Q128 150 128 128" fill="#9b8b7b" opacity="0.5"/>

  <!-- Mustache -->
  <path d="M85 121 Q92 127 100 123 Q108 127 115 121" fill="#7b6b5b" stroke="#6b5b4b" stroke-width="0.5"/>

  <!-- Eyes - looking DOWN at work -->
  <ellipse cx="85" cy="108" rx="8" ry="5" fill="white"/>
  <ellipse cx="115" cy="108" rx="8" ry="5" fill="white"/>
  <!-- Pupils looking down -->
  <circle cx="86" cy="110" r="3.5" fill="#4a7fb5"/>
  <circle cx="116" cy="110" r="3.5" fill="#4a7fb5"/>
  <circle cx="86" cy="111" r="1.5" fill="#1a3050"/>
  <circle cx="116" cy="111" r="1.5" fill="#1a3050"/>
  <!-- Slight squint - focused -->
  <path d="M76 105 Q81 103 93 105" fill="none" stroke="#5b4b3b" stroke-width="2" stroke-linecap="round"/>
  <path d="M107 105 Q119 103 124 105" fill="none" stroke="#5b4b3b" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M100 110 L97 119 Q100 121 103 119 Z" fill="#b8895a" opacity="0.5"/>

  <!-- Focused expression - slight concentration -->
  <path d="M90 132 Q100 134 112 131" fill="none" stroke="#8b5a3a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="57" cy="113" rx="6" ry="10" fill="#c4956a"/>
  <ellipse cx="143" cy="113" rx="6" ry="10" fill="#c4956a"/>

  <!-- Beanie / Cap -->
  <path d="M55 98 Q55 58 100 51 Q145 58 145 98" fill="#1e3a5f"/>
  <rect x="55" y="93" width="90" height="10" rx="3" fill="#162d4a"/>
  <path d="M55 98 Q55 103 58 103 L142 103 Q145 103 145 98" fill="#142640"/>

  <!-- Gold anchor on cap -->
  <circle cx="100" cy="75" r="4" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="100" y1="79" x2="100" y2="91" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="94" y1="83" x2="106" y2="83" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M93 88 Q93 93 100 94 Q107 93 107 88" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>

  <!-- RIGHT HAND holding pen/clipboard -->
  <!-- Clipboard -->
  <rect x="130" y="140" width="30" height="38" rx="3" fill="#2a3a4a" stroke="#d4af37" stroke-width="1"/>
  <rect x="138" y="143" width="2" height="3" rx="1" fill="#d4af37"/>
  <!-- Lines on clipboard -->
  <line x1="134" y1="150" x2="154" y2="150" stroke="#4a5a6a" stroke-width="1"/>
  <line x1="134" y1="155" x2="152" y2="155" stroke="#4a5a6a" stroke-width="1"/>
  <line x1="134" y1="160" x2="150" y2="160" stroke="#4a5a6a" stroke-width="1"/>
  <line x1="134" y1="165" x2="148" y2="165" stroke="#4a5a6a" stroke-width="1"/>
  <!-- Checkmarks on clipboard -->
  <path d="M133 149 L134.5 151 L137 148" fill="none" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
  <path d="M133 154 L134.5 156 L137 153" fill="none" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
  <path d="M133 159 L134.5 161 L137 158" fill="none" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>

  <!-- Hand -->
  <ellipse cx="132" cy="155" rx="8" ry="6" fill="#c4956a"/>

  <!-- Pen -->
  <line x1="145" y1="168" x2="155" y2="180" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <circle cx="155" cy="181" r="1.5" fill="#d4af37"/>
</svg>
